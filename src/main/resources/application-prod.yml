server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: ${PROD_DB_URL}
    username: ${PROD_DB_USERNAME}
    password: ${PROD_DB_PASSWORD}

mybatis:
  mapper-locations: classpath:/com/locker/be/**/*.xml
  type-aliases-package: com.locker.be

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

google:
  client-id: ${GOOGLE_CLIENT_ID}

jwt:
  secret: ${JWT_SECRET}
  access-token-expire-ms: 3600000

file:
  upload:
    product-path: ${PRODUCT_UPLOAD_PATH:uploads/product}

kiosk:
  allowed-code: ${VERIFY_CODE}

logging:
  file:
    name: logs/loocker-be.log