server:
  port: 8080

spring:
  config:
    activate:
      on-profile: local

  # ===== MSSQL Datasource =====
  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: jdbc:sqlserver://localhost:1433;databaseName=locker;encrypt=false;trustServerCertificate=true
    username:
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  sql:
    init:
      mode: never

# ===== MyBatis (XML 기반) =====
mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.locker.be.dto
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: null

# ===== Swagger (springdoc-openapi) =====
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true