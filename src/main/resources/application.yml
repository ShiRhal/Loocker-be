server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: jdbc:sqlserver://10.207.55.169:1433;databaseName=Locker;encrypt=true;trustServerCertificate=true
